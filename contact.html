<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ameer Hamza - Student Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="logo-container">
            <img src="images/logo.png" alt="Bahria University Logo" class="logo">
            <span class="site-title">Student Portfolio</span>
        </div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="contact-section">
            <h2>Contact Me</h2>
            <p class="form-intro">Have a question or want to discuss a project? Get in touch below!</p>
            <form action="#" method="post" class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your full name">
                
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                
                <label for="topic">Topic</label>
                <select id="topic" name="topic">
                    <option value="general">General Inquiry</option>
                    <option value="project">Project Collaboration</option>
                </select>
                
                <label for="msg">Message</label>
                <textarea id="msg" name="msg" rows="5" placeholder="Write your message here..."></textarea>
                
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Ameer Hamza. All rights reserved.</p>
    </footer>
</body>

</html>
